name: rideksa
description: "RideKSA - Ride Hailing & Fleet Management App for Saudi Arabia"
publish_to: 'none'
version: 0.0.14+17

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.10

  # State Management
  provider: ^6.1.5
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Network
  http: ^1.6.0
  dio: ^5.7.0

  # App info
  package_info_plus: ^8.3.0

  # SMS OTP auto-read (SMS Retriever API, no permissions needed)
  sms_autofill: ^2.4.1

  # Location & Maps
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.12.0
  # geoflutterfire2: ^2.3.16  # using custom radius filter in LocationService instead

  # Storage
  shared_preferences: ^2.5.3

  # UI
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  intl: ^0.19.0
  lottie: ^3.3.1
  flutter_rating_bar: ^4.0.1

  # Utils
  uuid: ^4.5.1
  connectivity_plus: ^6.1.2
  url_launcher: ^6.3.1
  flutter_play_integrity_wrapper:
    path: plugins/flutter_play_integrity_wrapper

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
